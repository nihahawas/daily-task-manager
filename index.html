<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Task Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px 0;
            display: flex;
            justify-content: center;
            background: #f0f2f5;
            transition: 0.3s;
        }

        .dark {
            background: #1a202c;
            color: white;
        }

        .container {
            background: white;
            width: 420px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .dark .container {
            background: #2d3748;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            margin-bottom: 15px;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: 0.2s;
        }

        .toggle-btn {
            background: #1d24ab;
            color: white;
            padding: 8px 15px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input, select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
        }

        .add-btn {
            background: #1d24ab;
            color: white;
            padding: 10px;
            font-weight: bold;
            font-size: 15px;
        }

        .filters {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
        }

        .filter-btn {
            background: #edf2f7;
            padding: 6px 18px;
            font-size: 13px;
        }

        .dark .filter-btn {
            background: #4a5568;
            color: white;
        }

        /* Task Cards Layout */
        .task {
            margin-top: 12px;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            position: relative;
        }

        /* Priority Colors based on your images */
        .high { background: #fed7d7; }
        .medium { background: #feebc8; }
        .low { background: #c6f6d5; }

        .dark .high { background: #f19393; }
        .dark .medium { background: #e68ded; }
        .dark .low { background: #71b394; }

        .task-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .task-title {
            font-weight: bold;
            font-size: 16px;
        }

        .deadline-text {
            font-size: 12px;
            opacity: 0.8;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .actions button {
            padding: 5px 12px;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.7);
            color: #333;
        }

        .dark .actions button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .completed {
            opacity: 0.5;
            text-decoration: line-through;
        }
        
        .completed .task-title { text-decoration: line-through; }
    </style>
</head>
<body>

<div class="container">
    <h1>Smart Task Manager</h1>

    <div class="top-bar">
        <span id="counter">0 active task(s)</span>
        <button class="toggle-btn" onclick="toggleDark()">Dark Mode</button>
    </div>

    <form id="taskForm">
        <input type="text" id="taskInput" placeholder="Enter task..." required>
        <input type="date" id="deadline"> 
        <select id="prioritySelect" required>
            <option value="">Priority</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
        </select>
        <button class="add-btn" type="submit">Add Task</button>
    </form>

    <div class="filters">
        <button class="filter-btn" onclick="setFilter('all')">All</button>
        <button class="filter-btn" onclick="setFilter('active')">Active</button>
        <button class="filter-btn" onclick="setFilter('completed')">Completed</button>
    </div>

    <div id="taskList"></div>
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
    let currentFilter = "all";

    const form = document.getElementById("taskForm");
    const input = document.getElementById("taskInput");
    const deadline = document.getElementById("deadline");
    const priority = document.getElementById("prioritySelect");
    const list = document.getElementById("taskList");
    const counter = document.getElementById("counter");

    function saveTasks() {
        localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    function toggleDark() {
        document.body.classList.toggle("dark");
    }

    function setFilter(filter) {
        currentFilter = filter;
        render();
    }

    function render() {
        list.innerHTML = "";
        
        const activeCount = tasks.filter(t => !t.completed).length;
        counter.textContent = `${activeCount} active task(s)`;

        let filtered = tasks.filter(t => {
            if (currentFilter === "active") return !t.completed;
            if (currentFilter === "completed") return t.completed;
            return true;
        });

        filtered.forEach((task) => {
            const realIndex = tasks.indexOf(task);
            const taskEl = document.createElement("div");
            taskEl.className = `task ${task.priority} ${task.completed ? 'completed' : ''}`;
            
            taskEl.innerHTML = `
                <div class="task-top">
                    <div class="task-info">
                        <div class="task-title">${task.name}</div>
                        <div class="deadline-text">Deadline: ${task.deadline || 'No deadline'}</div>
                    </div>
                    <div class="actions">
                        <button onclick="toggle(${realIndex})">${task.completed ? "Undo" : "Done"}</button>
                        <button onclick="removeTask(${realIndex})">Delete</button>
                    </div>
                </div>
            `;
            list.appendChild(taskEl);
        });
    }

    function toggle(index) {
        tasks[index].completed = !tasks[index].completed;
        saveTasks();
        render();
    }

    function removeTask(index) {
        tasks.splice(index, 1);
        saveTasks();
        render();
    }

    form.addEventListener("submit", function(e) {
        e.preventDefault();
        tasks.push({
            name: input.value,
            deadline: deadline.value,
            priority: priority.value,
            completed: false
        });
        saveTasks();
        form.reset();
        render();
    });

    render();
</script>

</body>
</html>
