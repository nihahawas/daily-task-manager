<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Task Manager Pro</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 40px 0;
  display: flex;
  justify-content: center;
  background: #f4f6f9;
  transition: 0.3s;
}

.dark {
  background: #1a202c;
  color: white;
}

.container {
  background: white;
  width: 400px;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  transition: 0.3s;
}

.dark .container {
  background: #2d3748;
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  margin-bottom: 15px;
}

button {
  cursor: pointer;
  border: none;
  padding: 6px 10px;
  border-radius: 6px;
}

.toggle-btn {
  background: #1d24ab;
  color: white;
}

form {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

input, select {
  padding: 8px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

.add-btn {
  background: #1d24ab;
  color: white;
}

.filters {
  display: flex;
  justify-content: space-between;
  margin-top: 15px;
}

.filter-btn {
  background: #edf2f7;
}

.dark .filter-btn {
  background: #4a5568;
  color: white;
}

.task {
  margin-top: 10px;
  padding: 10px;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  font-size: 14px;
}

.high { background: #fed7d7; }
.medium { background: #feebc8; }
.low { background: #c6f6d5; }

.dark .high { background: #f19393; }
.dark .medium { background: #e68ded; }
.dark .low { background: #8ceec0; }

.task-top {
  display: flex;
  justify-content: space-between;
}

.completed {
  text-decoration: line-through;
  opacity: 0.6;
}

.actions button {
  margin-left: 5px;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="container">
  <h1>Smart Task Manager</h1>



  <div class="top-bar">
    <span id="counter"></span>
    <button class="toggle-btn" onclick="toggleDark()">Dark Mode</button>
  </div>

  <form id="taskForm">
    <input type="text" id="taskInput" placeholder="Enter task..." required>
    <input type="date" id="deadline">
    <select id="prioritySelect" required>
      <option value="">Priority</option>
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
    </select>
    <button class="add-btn" type="submit">Add Task</button>
  </form>

  <div class="filters">
    <button class="filter-btn" onclick="setFilter('all')">All</button>
    <button class="filter-btn" onclick="setFilter('active')">Active</button>
    <button class="filter-btn" onclick="setFilter('completed')">Completed</button>
  </div>

  <div id="taskList"></div>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
let currentFilter = "all";

const form = document.getElementById("taskForm");
const input = document.getElementById("taskInput");
const deadline = document.getElementById("deadline");
Aconst priority = document.getElementById("prioritySelect");
const list = document.getElementById("taskList");
const counter = document.getElementById("counter");

function saveTasks() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
}

function toggleDark() {
  document.body.classList.toggle("dark");
}

function setFilter(filter) {
  currentFilter = filter;
  render();
}

function render() {
  list.innerHTML = "";

  let filtered = tasks.filter(task => {
    if (currentFilter === "active") return !task.completed;
    if (currentFilter === "completed") return task.completed;
    return true;
  });

  const remaining = tasks.filter(t => !t.completed).length;
  counter.textContent = `${remaining} active task(s)`;

  filtered.forEach((task, index) => {
    const div = document.createElement("div");
    div.className = `task ${task.priority}`;
    if (task.completed) div.classList.add("completed");

    div.innerHTML = `
      <div class="task-top">
        <strong>${task.name}</strong>
        <div class="actions">
          <button onclick="toggle(${index})">${task.completed ? "Undo" : "Done"}</button>
          <button onclick="removeTask(${index})">Delete</button>
        </div>
      </div>
      ${task.deadline ? `<small>Deadline: ${task.deadline}</small>` : ""}
    `;

    list.appendChild(div);
  });
}

function toggle(index) {
  tasks[index].completed = !tasks[index].completed;
  saveTasks();
  render();
}

function removeTask(index) {
  tasks.splice(index, 1);
  saveTasks();
  render();
}

form.addEventListener("submit", function(e) {
  e.preventDefault();

  tasks.push({
    name: input.value,
    deadline: deadline.value,
    priority: priority.value,
    completed: false
  });

  saveTasks();
  form.reset();
  render();
});

render();
</script>

</body>
</html>
